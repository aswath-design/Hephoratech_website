<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  #card{
    width:1200px;height:630px;position:relative;overflow:hidden;
    background:#04060D;font-family:'Inter',sans-serif;
  }
  .grid{
    position:absolute;inset:0;
    background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
    background-size:54px 54px;
    -webkit-mask-image:radial-gradient(ellipse 70% 80% at 30% 40%,#000,transparent 80%);
  }
  .orb1{position:absolute;width:620px;height:620px;border-radius:50%;
    background:radial-gradient(circle,rgba(30,95,255,.5),transparent 66%);
    top:-220px;right:-160px;filter:blur(50px)}
  .orb2{position:absolute;width:460px;height:460px;border-radius:50%;
    background:radial-gradient(circle,rgba(76,130,255,.32),transparent 66%);
    bottom:-220px;left:-120px;filter:blur(60px)}
  .in{position:absolute;inset:0;padding:88px 90px;display:flex;flex-direction:column;justify-content:space-between}
  .top{display:flex;align-items:center;gap:18px}
  .mark{width:60px;height:60px}
  .mark svg{width:100%;height:100%;display:block}
  .brand{font-size:30px;font-weight:800;letter-spacing:.16em;color:#EEF2FA}
  .brand span{color:#4C82FF}
  .pill{display:inline-flex;align-items:center;gap:9px;align-self:flex-start;
    padding:9px 20px;border-radius:100px;border:1px solid rgba(30,95,255,.34);
    background:rgba(30,95,255,.12);color:#8FB4FF;font-size:19px;font-weight:600;margin-bottom:26px}
  .dot{width:9px;height:9px;border-radius:50%;background:#4C82FF;box-shadow:0 0 12px #4C82FF}
  h1{font-size:74px;line-height:1.05;font-weight:800;letter-spacing:-.03em;color:#F4F7FC;max-width:900px}
  h1 b{color:#4C82FF;font-weight:800}
  .sub{margin-top:26px;font-size:26px;line-height:1.5;color:#93A0B8;max-width:820px}
  .foot{display:flex;align-items:center;gap:30px;font-size:21px;color:#B7C2D6;font-weight:600}
  .foot .sep{width:5px;height:5px;border-radius:50%;background:#4C82FF}
  .foot .site{color:#4C82FF;font-weight:700}
</style>
</head>
<body>
<div id="card">
  <div class="grid"></div>
  <div class="orb1"></div>
  <div class="orb2"></div>
  <div class="in">
    <div class="top">
      <span class="mark"><svg viewBox="0 0 48 48" fill="none">
        <path d="M8 40V8l10 8v16l14-16v24" stroke="#EEF2FA" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
        <path d="M30 26l10-8v22" stroke="#4C82FF" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
      </svg></span>
      <span class="brand">HEPHORA<span>TECH</span></span>
    </div>
    <div>
      <span class="pill"><span class="dot"></span>Full-stack digital studio · Tiruppur</span>
      <h1>We build the <b>technology</b> that runs your business.</h1>
      <p class="sub">Websites, e-commerce, custom software, and SaaS — designed, built, and grown by one team.</p>
    </div>
    <div class="foot">
      <span class="site">hephoratech.com</span>
      <span class="sep"></span><span>Web &amp; Apps</span>
      <span class="sep"></span><span>E-Commerce</span>
      <span class="sep"></span><span>SEO</span>
      <span class="sep"></span><span>Automation &amp; AI</span>
    </div>
  </div>
</div>
</body>
</html>
