<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" fill="none">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#111a2c"/><stop offset="0.55" stop-color="#0d1424"/><stop offset="1" stop-color="#0a101d"/>
</linearGradient>
<linearGradient id="bl" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#2f6bff"/><stop offset="1" stop-color="#7aa5ff"/>
</linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffffff" stop-opacity="0.095"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.055"/>
</linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#1b2b4f"/><stop offset="0.55" stop-color="#152340"/><stop offset="1" stop-color="#101a30"/>
</radialGradient>
<filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
<feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.5"/>
</filter>

</defs>
<style>
.ht-route{stroke-dasharray:9 9;animation:flow 2.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-36}}
.ht-pin{transform-box:fill-box;transform-origin:center bottom;animation:drop 6s cubic-bezier(.34,1.4,.5,1) infinite}
@keyframes drop{0%,6%{transform:translateY(-26px) scale(.7);opacity:0}16%{transform:translateY(0) scale(1);opacity:1}80%{transform:translateY(0) scale(1);opacity:1}92%,100%{transform:translateY(-26px) scale(.7);opacity:0}}
.ht-ring{animation:fill 6s cubic-bezier(.4,0,.2,1) infinite}
@keyframes fill{0%,8%{stroke-dasharray:0 256}55%,82%{stroke-dasharray:105 151}96%,100%{stroke-dasharray:0 256}}
.ht-drv{transform-box:fill-box;transform-origin:center;animation:beat 2.4s ease-in-out infinite;animation-delay:calc(var(--i)*.35s)}
@keyframes beat{0%,100%{transform:scale(.85);opacity:.55}50%{transform:scale(1.3);opacity:1}}
@media (prefers-reduced-motion:reduce){.ht-route,.ht-pin,.ht-ring,.ht-drv{animation:none}}
</style>
<rect width="880" height="560" rx="28" fill="url(#bg)"/>
