<rect x="104" y="246" width="90" height="12" rx="4" fill="#1e5fff"/>
<rect x="104" y="270" width="180" height="8" rx="4" fill="#dfe9ff"/>
<rect x="104" y="330" width="120" height="28" rx="8" fill="url(#bl)"/>
<rect x="84" y="392" width="130" height="60" rx="10" fill="#eef4ff"/>
<rect x="230" y="392" width="130" height="60" rx="10" fill="#eef4ff"/>
<rect x="376" y="392" width="130" height="60" rx="10" fill="#eef4ff"/>

<!-- human-handoff chip floating top-right -->
