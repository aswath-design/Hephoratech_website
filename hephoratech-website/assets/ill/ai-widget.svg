<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" fill="none">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f8ff"/><stop offset="0.55" stop-color="#e9f1ff"/><stop offset="1" stop-color="#dfeaff"/></linearGradient>
<linearGradient id="bl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b3fd4"/><stop offset="1" stop-color="#4a80ff"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.72"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#c3d8ff"/><stop offset="0.55" stop-color="#d8e6ff"/><stop offset="1" stop-color="#e6eeff"/></radialGradient>
<filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0d1322" flood-opacity="0.11"/></filter>
</defs>
<style>
.ht-cell{transform-box:fill-box;transform-origin:center;animation:pop 6s ease-in-out infinite;animation-delay:calc(var(--i)*.5s)}
@keyframes pop{0%,6%{opacity:0;transform:scale(.6) translateY(6px)}18%,80%{opacity:1;transform:none}94%,100%{opacity:0;transform:scale(.6) translateY(6px)}}
.blink{animation:blink 6s ease-in-out infinite}
@keyframes blink{0%,45%{opacity:1}55%,100%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.ht-cell,.blink{animation:none;opacity:1}}
</style>
<rect width="880" height="560" rx="28" fill="url(#bg)"/>
<circle cx="730" cy="92" r="150" fill="url(#glow)" opacity="0.72"/>
<circle cx="120" cy="482" r="130" fill="url(#glow)" opacity="0.55"/>

<!-- browser window (the site the widget lives on) -->
<rect x="60" y="94" width="470" height="374" rx="22" fill="url(#glass)" stroke="#ffffff" stroke-width="1.5" filter="url(#sh)"/>
